[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pomodoro-widget"
version = "1.0.0"
description = "Pomodoro - relogio com alarme de tela cheia (Omarchy / Hyprland)"
requires-python = ">=3.12"
dependencies = ["PyGObject"]

[project.scripts]
pomodoro = "pomodoro.__main__:main"

[tool.setuptools]
packages = ["pomodoro"]
