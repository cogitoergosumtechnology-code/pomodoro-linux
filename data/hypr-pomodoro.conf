# Pomodoro widget (Hyprland <= 0.52, hyprland.conf)
windowrule = float, class:^(pomodoro)$
windowrule = pin, class:^(pomodoro)$
windowrule = noborder, class:^(pomodoro)$
windowrule = norounding, class:^(pomodoro)$
windowrule = noshadow, class:^(pomodoro)$
windowrule = noblur, class:^(pomodoro)$
windowrule = noanim, class:^(pomodoro)$
windowrule = noinitialfocus, class:^(pomodoro)$
windowrule = nodim, class:^(pomodoro)$
windowrule = nomaxsize, class:^(pomodoro)$

# Pomodoro alarme (só usado no fallback sem layer-shell)
windowrule = fullscreen, class:^(pomodoro-alarm)$
windowrule = pin, class:^(pomodoro-alarm)$
windowrule = stayfocused, class:^(pomodoro-alarm)$
windowrule = noanim, class:^(pomodoro-alarm)$
